<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 — FinAnalyzer</title>
<style>
  :root {
    --navy: #0d3b7c; --blue: #185fa5; --accent: #2e80d8;
    --safe: #0F6E56; --danger: #A32D2D; --warn: #B8860B;
    --bg: #f7f9fc; --surface: #fff; --border: #e2e8f0;
    --text: #1a2332; --text2: #6b7a8d; --text3: #9aa7b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 900px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--navy); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; margin-bottom: 16px;
  }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  input {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  button {
    padding: 10px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--blue); }
  .btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: #eef2f7; }
  .btn-full { width: 100%; }
  .error-msg { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
  .hidden { display: none !important; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .info-item { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .info-item .l { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
  .info-item .v { font-size: 14px; font-weight: 600; }

  .count-badge {
    display: inline-flex; align-items: center; gap: 6px; background: #EBF2FA; color: var(--blue);
    font-size: 20px; font-weight: 800; padding: 8px 16px; border-radius: 20px; margin-bottom: 16px;
  }
  .count-badge span { font-size: 12px; font-weight: 500; color: var(--text2); }

  .quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .quick-row button { flex: 1; min-width: 60px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text2); }
  th { font-weight: 600; color: var(--text3); font-size: 11px; }
  .section-title { font-size: 13px; font-weight: 700; margin: 18px 0 8px; color: var(--navy); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }

  /* ── 프로모션 코드 / 분석이력 / 환불 처리 ── */
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .tag-on  { background: #E1F5EE; color: var(--safe); }
  .tag-off { background: #e5e4e0; color: #8a8a86; }
  .tag-pct { background: #FCEBEB; color: var(--danger); }
  .muted { color: var(--text3); font-size: 11px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .form-grid .field { margin-bottom: 0; }
  .check-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .check-row label { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 0; }
  .check-row input { width: auto; }
  select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff;
  }
  .table-wrap { overflow-x: auto; }
  .btn-xs { padding: 4px 10px; font-size: 11px; }
  .row-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .warn-box {
    background: #FCEBEB; border: 1px solid #f0c9c9; border-radius: 8px; padding: 10px 12px;
    font-size: 12px; color: #7d2020; line-height: 1.6; margin-bottom: 12px;
  }
  .refund-panel { background: var(--bg); border-radius: 10px; padding: 14px; margin-top: 10px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row input { flex: 1; }
</style>
</head>
<body>

<div class="wrap">
  <h1>🔐 FinAnalyzer 관리자</h1>

  <!-- 로그인 -->
  <div class="card" id="loginCard">
    <div class="field">
      <label>관리자 비밀번호</label>
      <input type="password" id="admin-pw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <button class="btn-primary btn-full" onclick="doLogin()">로그인</button>
    <div class="error-msg" id="login-error"></div>
  </div>

  <!-- 검색 -->
  <div class="card hidden" id="searchCard">
    <div class="field">
      <label>회원 이메일 (가입 시 사용한 로그인 ID)</label>
      <div class="row">
        <input type="email" id="search-email" placeholder="user@example.com" onkeydown="if(event.key==='Enter')searchUser()" />
        <button class="btn-primary" onclick="searchUser()">검색</button>
      </div>
    </div>
    <div class="error-msg" id="search-error"></div>
    <button class="btn-ghost btn-full" onclick="toggleUserList()" id="listToggleBtn" style="margin-top:12px;">📋 전체 가입자 목록 보기</button>
    <button class="btn-ghost btn-full" onclick="toggleRefundList()" id="refundToggleBtn" style="margin-top:8px;">💸 환불 신청 내역 보기</button>
    <button class="btn-ghost btn-full" onclick="toggleCommunityList()" id="communityToggleBtn" style="margin-top:8px;">🗨️ 커뮤니티 게시글 관리</button>
    <button class="btn-ghost btn-full" onclick="togglePromoList()" id="promoToggleBtn" style="margin-top:8px;">🎟️ 프로모션 코드 관리</button>
    <button class="btn-ghost btn-full" onclick="toggleHistList()" id="histToggleBtn" style="margin-top:8px;">📊 회원 분석이력 보기</button>
  </div>

  <!-- 전체 회원 목록 -->
  <div class="card hidden" id="userListCard"></div>

  <!-- 환불 신청 목록 -->
  <div class="card hidden" id="refundListCard"></div>

  <!-- 커뮤니티 게시글 목록 -->
  <div class="card hidden" id="communityListCard"></div>

  <!-- 결과 -->
  <!-- 프로모션 코드 -->
  <div class="card hidden" id="promoCard"></div>

  <!-- 회원 분석이력 -->
  <div class="card hidden" id="histCard"></div>

  <div class="card hidden" id="resultCard"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = "https://analyze-1-250m.onrender.com";
let adminPw = sessionStorage.getItem("admin_pw") || "";
let currentEmail = "";

if (adminPw) showSearch();

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json", "X-Admin-Password": adminPw } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_BASE + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "요청 처리 중 오류가 발생했습니다.");
  return data;
}

async function doLogin() {
  const pw = document.getElementById("admin-pw").value;
  const errEl = document.getElementById("login-error");
  errEl.style.display = "none";
  if (!pw) return;
  try {
    await fetch(API_BASE + "/admin/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    }).then(async res => {
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.detail || "로그인 실패");
    });
    adminPw = pw;
    sessionStorage.setItem("admin_pw", pw);
    showSearch();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = "block";
  }
}

// 목록 카드는 한 번에 하나만 보이도록
function hideOtherCards(keep) {
  ["resultCard", "userListCard", "refundListCard", "communityListCard", "promoCard", "histCard"]
    .filter(id => id !== keep)
    .forEach(id => { const el = document.getElementById(id); if (el) el.classList.add("hidden"); });
  const labels = {
    listToggleBtn: "📋 전체 가입자 목록 보기",
    refundToggleBtn: "💸 환불 신청 내역 보기",
    communityToggleBtn: "🗨️ 커뮤니티 게시글 관리",
    promoToggleBtn: "🎟️ 프로모션 코드 관리",
    histToggleBtn: "📊 회원 분석이력 보기",
  };
  const cardOf = {
    listToggleBtn: "userListCard", refundToggleBtn: "refundListCard",
    communityToggleBtn: "communityListCard", promoToggleBtn: "promoCard", histToggleBtn: "histCard",
  };
  Object.keys(labels).forEach(btnId => {
    if (cardOf[btnId] === keep) return;
    const b = document.getElementById(btnId);
    if (b) b.textContent = labels[btnId];
  });
}

function esc(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

// 서버는 UTC로 저장하므로 현지시각으로 변환
function fmtDT(iso, withTime) {
  if (!iso) return "-";
  const d = new Date(/[Z+]/.test(iso) ? iso : iso + "Z");
  if (isNaN(d)) return "-";
  const p = n => String(n).padStart(2, "0");
  const base = `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
  return withTime ? `${base} ${p(d.getHours())}:${p(d.getMinutes())}` : base;
}

function showSearch() {
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("searchCard").classList.remove("hidden");
}

async function searchUser() {
  const email = document.getElementById("search-email").value.trim();
  const errEl = document.getElementById("search-error");
  errEl.style.display = "none";
  if (!email) return;
  try {
    const d = await api("GET", `/admin/user?email=${encodeURIComponent(email)}`);
    currentEmail = d.email;
    document.getElementById("userListCard").classList.add("hidden");
    document.getElementById("refundListCard").classList.add("hidden");
    document.getElementById("communityListCard").classList.add("hidden");
    renderResult(d);
  } catch (e) {
    document.getElementById("resultCard").classList.add("hidden");
    errEl.textContent = e.message;
    errEl.style.display = "block";
    if (e.message.includes("비밀번호") || e.message.includes("401")) {
      sessionStorage.removeItem("admin_pw");
      adminPw = "";
      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("searchCard").classList.add("hidden");
    }
  }
}

async function toggleUserList() {
  const card = document.getElementById("userListCard");
  const btn = document.getElementById("listToggleBtn");
  if (!card.classList.contains("hidden")) {
    card.classList.add("hidden");
    btn.textContent = "📋 전체 가입자 목록 보기";
    return;
  }
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("refundListCard").classList.add("hidden");
  document.getElementById("communityListCard").classList.add("hidden");
  btn.textContent = "불러오는 중...";
  try {
    const d = await api("GET", "/admin/users");
    renderUserList(d);
    card.classList.remove("hidden");
    btn.textContent = "📋 목록 닫기";
  } catch (e) {
    toast_admin_error(e.message);
    btn.textContent = "📋 전체 가입자 목록 보기";
  }
}

function toast_admin_error(msg) {
  const errEl = document.getElementById("search-error");
  errEl.textContent = msg;
  errEl.style.display = "block";
}

function renderUserList(d) {
  const card = document.getElementById("userListCard");
  const rows = d.users.map(u => `
    <tr style="cursor:pointer;" onclick="jumpToUser('${u.email.replace(/'/g, "\\'")}')">
      <td>${u.company_name || "-"}</td>
      <td>${u.email}</td>
      <td>${u.rep_name || "-"}</td>
      <td>${u.phone || "-"}</td>
      <td style="text-align:right;font-weight:700;">${u.remaining_count}건</td>
      <td>${u.created_at ? u.created_at.slice(0,10) : "-"}</td>
    </tr>`).join("");
  card.innerHTML = `
    <div class="section-title">전체 가입자 (${d.count}명)</div>
    <table>
      <thead><tr><th>회사명</th><th>이메일</th><th>대표자</th><th>휴대폰</th><th>잔여횟수</th><th>가입일</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:#9aa7b8;">가입자가 없습니다.</td></tr>`}</tbody>
    </table>`;
}

function jumpToUser(email) {
  document.getElementById("search-email").value = email;
  searchUser();
}

async function toggleRefundList() {
  const card = document.getElementById("refundListCard");
  const btn = document.getElementById("refundToggleBtn");
  if (!card.classList.contains("hidden")) {
    card.classList.add("hidden");
    btn.textContent = "💸 환불 신청 내역 보기";
    return;
  }
  hideOtherCards("refundListCard");
  btn.textContent = "불러오는 중...";
  try {
    const d = await api("GET", "/admin/refund-requests");
    renderRefundList(d);
    card.classList.remove("hidden");
    btn.textContent = "💸 목록 닫기";
  } catch (e) {
    toast_admin_error(e.message);
    btn.textContent = "💸 환불 신청 내역 보기";
  }
}

const REFUND_STATUS_KR = { pending: "처리 대기", processed: "환불 완료", rejected: "반려" };

function renderRefundList(d) {
  const card = document.getElementById("refundListCard");
  const rows = d.requests.map(r => {
    const pays = (r.payments || []).filter(p => p.cancellable > 0);   // 환불 가능한 실결제 건만
    const options = pays.map(p =>
      `<option value="${esc(p.order_id)}" data-cancellable="${p.cancellable}">
         ${esc(fmtDT(p.created_at))} · ${Number(p.amount).toLocaleString("ko-KR")}원 · ${esc(p.package_label)}${
           p.cancelled_amount ? " (취소가능 " + Number(p.cancellable).toLocaleString("ko-KR") + "원)" : ""}
       </option>`).join("");

    const isPending = r.status === "pending";
    const canRefund = pays.length > 0;

    // 크레딧 출처 요약 (관리자가 넣어준 분과 실결제분 구분)
    const cs = r.credit_summary;
    const summary = cs ? `
      <div style="background:#EBF2FA;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;line-height:1.7;">
        <strong>크레딧 출처</strong>
        &nbsp;· 실결제 지급 <strong>${cs.paid_credits}</strong>
        &nbsp;· 분석 사용 <strong>-${cs.used_credits}</strong>
        &nbsp;· 관리자 지급/조정 <strong style="color:${cs.admin_adjusted >= 0 ? "var(--safe)" : "var(--danger)"};">${cs.admin_adjusted >= 0 ? "+" : ""}${cs.admin_adjusted}</strong>
        &nbsp;→ 현재 잔여 <strong>${cs.current_credits}</strong> (${Math.floor(cs.current_credits / 10)}건)
        <div class="muted" style="margin-top:4px;">
          관리자 지급/조정분은 별도 기록이 없어 역산한 값입니다. <strong>환불 대상은 실결제 건에 한합니다.</strong>
        </div>
      </div>` : "";

    // 결제 내역 (취소된 건도 함께)
    const payTable = (r.payments || []).length ? `
      <div class="section-title" style="margin-top:0;">결제 내역</div>
      <div class="table-wrap"><table>
        <thead><tr><th>결제일</th><th>주문번호</th><th>이용권</th><th>결제금액</th><th>지급 크레딧</th><th>상태</th></tr></thead>
        <tbody>${r.payments.map(p => `<tr>
          <td style="white-space:nowrap;">${esc(fmtDT(p.created_at))}</td>
          <td class="muted">${esc(p.order_id)}</td>
          <td>${esc(p.package_label)}</td>
          <td style="white-space:nowrap;">${Number(p.amount).toLocaleString("ko-KR")}원${
            p.cancelled_amount ? `<div class="muted">취소 ${Number(p.cancelled_amount).toLocaleString("ko-KR")}원</div>` : ""}</td>
          <td>${p.credits}</td>
          <td><span class="tag ${p.status === "결제완료" ? "tag-on" : (p.status === "취소완료" ? "tag-off" : "tag-pct")}">${p.status}</span></td>
        </tr>`).join("")}</tbody>
      </table></div>` : `<div class="muted" style="margin-bottom:12px;">실제 결제 내역이 없습니다. (관리자가 지급한 크레딧만 보유)</div>`;

    const actions = `<div class="row-actions">
        <button class="btn-ghost btn-xs" onclick="toggleRefundPanel(${r.id})">상세</button>
        ${isPending ? `
          <button class="btn-primary btn-xs" onclick="toggleRefundPanel(${r.id}, true)">환불 처리</button>
          <button class="btn-ghost btn-xs" onclick="resolveRefund(${r.id}, 'processed')">완료 처리</button>
          <button class="btn-ghost btn-xs" onclick="resolveRefund(${r.id}, 'rejected')">반려</button>` : ""}
      </div>`;

    // 처리가 끝난 신청의 결과 요약 (나중에 다시 확인할 수 있도록)
    const resultBox = !isPending ? `
      <div style="background:${r.status === "processed" ? "#E1F5EE" : "#f2f2f0"};border-radius:8px;
                  padding:10px 12px;margin-bottom:12px;font-size:12px;line-height:1.7;">
        <strong>처리 결과</strong> · ${REFUND_STATUS_KR[r.status] || r.status}
        ${r.processed_at ? ` · ${esc(fmtDT(r.processed_at, true))}` : ""}
        ${r.refunded_amount ? ` · 환불 <strong>${Number(r.refunded_amount).toLocaleString("ko-KR")}원</strong>` : ""}
        ${r.credits_deducted ? ` · 크레딧 <strong>${r.credits_deducted}</strong> 회수` : ""}
        ${r.order_id ? ` · 주문번호 ${esc(r.order_id)}` : ""}
        ${r.admin_note ? `<div class="muted" style="margin-top:4px;">메모 : ${esc(r.admin_note)}</div>` : ""}
      </div>` : "";

    // 환불 실행 폼 — 처리 대기는 바로, 이미 처리된 건은 "추가 환불"로 구분
    const formBox = canRefund ? `
      <div class="warn-box">
        ${isPending
          ? `<strong>환불 실행을 누르면 포트원에서 실제로 결제가 취소되고 고객에게 돈이 돌아갑니다.</strong>
             되돌릴 수 없으니 결제건과 금액을 확인해주세요. 취소가 성공하면 크레딧 회수와 상태 변경까지 함께 처리됩니다.`
          : `<strong>이미 처리된 신청입니다.</strong> 아래는 아직 취소 가능한 금액이 남아 있는 결제건으로,
             <strong>추가 환불이 꼭 필요한 경우에만</strong> 사용하세요.`}
      </div>
      <div class="field"><label>취소할 결제건</label><select id="rf-order-${r.id}">${options}</select></div>
      <div class="form-grid">
        <div class="field"><label>환불 금액 (비우면 전액)</label><input type="number" id="rf-amount-${r.id}" min="1" placeholder="전액"/></div>
        <div class="field"><label>회수 크레딧 (비우면 자동)</label><input type="number" id="rf-credits-${r.id}" min="0" placeholder="자동"/></div>
        <div class="field"><label>취소 사유 (포트원 기록)</label><input type="text" id="rf-reason-${r.id}" value="고객 환불 요청"/></div>
        <div class="field"><label>처리 메모 (내부용)</label><input type="text" id="rf-note-${r.id}" placeholder="예: 약관 제2조 미사용분"/></div>
      </div>
      <button class="btn-primary" style="margin-top:12px;" onclick="doRefund(${r.id}, ${isPending ? "false" : "true"})">
        ${isPending ? "환불 실행" : "추가 환불 실행"}
      </button>
      <div class="error-msg" id="rf-err-${r.id}"></div>`
      : `<div class="muted">취소 가능한 결제 건이 없습니다. (전액 취소되었거나 실제 결제 내역이 없음)</div>`;

    const panel = `
      <tr id="refundPanelRow-${r.id}" class="hidden"><td colspan="6">
        <div class="refund-panel">
          ${resultBox}
          ${summary}
          ${payTable}
          ${formBox}
        </div>
      </td></tr>`;

    return `<tr>
      <td style="white-space:nowrap;">${esc(fmtDT(r.created_at))}</td>
      <td>${esc(r.company_name || "-")}<div class="muted">${esc(r.email)}</div>${r.phone ? `<div class="muted">${esc(r.phone)}</div>` : ""}</td>
      <td style="max-width:200px;white-space:normal;">${esc(r.reason || "-")}</td>
      <td style="white-space:nowrap;">${r.remaining_count !== null ? r.remaining_count + "건" : "-"}</td>
      <td><span class="tag ${isPending ? "tag-pct" : (r.status === "processed" ? "tag-on" : "tag-off")}">${REFUND_STATUS_KR[r.status] || r.status}</span>
          ${!isPending && r.refunded_amount ? `<div class="muted">${Number(r.refunded_amount).toLocaleString("ko-KR")}원 환불</div>` : ""}</td>
      <td>${actions}</td>
    </tr>${panel}`;
  }).join("");

  card.innerHTML = `
    <div class="section-title" style="margin-top:0;">환불 신청 내역 (${d.count}건)</div>
    <div class="table-wrap"><table>
      <thead><tr><th>신청일</th><th>회원</th><th>사유</th><th>잔여횟수</th><th>상태</th><th>처리</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:#9aa7b8;">환불 신청이 없습니다.</td></tr>`}</tbody>
    </table></div>`;
}

function toggleRefundPanel(id, forceOpen) {
  const row = document.getElementById("refundPanelRow-" + id);
  if (!row) return;
  if (forceOpen) row.classList.remove("hidden");
  else row.classList.toggle("hidden");
}

async function doRefund(id, allowReprocess) {
  const sel = document.getElementById("rf-order-" + id);
  if (!sel) return;
  const errEl = document.getElementById("rf-err-" + id);
  const setErr = m => { errEl.textContent = m || ""; errEl.style.display = m ? "block" : "none"; };
  setErr("");

  const orderId = sel.value;
  const cancellable = Number(sel.options[sel.selectedIndex].dataset.cancellable);
  const amountRaw = document.getElementById("rf-amount-" + id).value.trim();
  const amount = amountRaw ? parseInt(amountRaw, 10) : cancellable;
  const creditsRaw = document.getElementById("rf-credits-" + id).value.trim();

  if (!(amount > 0) || amount > cancellable) {
    setErr(`환불 금액은 1원 ~ ${cancellable.toLocaleString("ko-KR")}원 사이여야 합니다.`);
    return;
  }
  if (!confirm(`${orderId} 결제건에서 ${amount.toLocaleString("ko-KR")}원을 실제로 환불합니다.\n\n포트원에서 결제가 취소되고 고객에게 돈이 돌아갑니다.\n되돌릴 수 없습니다. 진행할까요?`)) return;

  try {
    const body = {
      order_id: orderId,
      amount: amountRaw ? amount : null,
      reason: document.getElementById("rf-reason-" + id).value.trim() || "고객 환불 요청",
      admin_note: document.getElementById("rf-note-" + id).value.trim(),
      allow_reprocess: !!allowReprocess,
    };
    if (creditsRaw !== "") body.deduct_credits = parseInt(creditsRaw, 10);

    const d = await api("POST", `/admin/refund-requests/${id}/refund`, body);
    let msg = `${Number(d.refunded_amount).toLocaleString("ko-KR")}원 환불 완료 · 크레딧 ${d.credits_deducted} 회수 (잔여 ${d.remaining_credits})`;
    if (d.credits_shortfall > 0) msg += ` / ⚠️ 이미 사용해서 ${d.credits_shortfall} 크레딧은 회수하지 못했습니다`;
    toast(msg);
    alert(msg);
    renderRefundList(await api("GET", "/admin/refund-requests"));
  } catch (e) {
    setErr(e.message);
    // 포트원 상태와 어긋났을 수 있으므로 목록을 다시 불러온다
    try { renderRefundList(await api("GET", "/admin/refund-requests")); } catch (err) {}
  }
}

async function resolveRefund(id, status) {
  const label = status === "processed" ? "환불 완료 처리" : "반려";
  let note = "";
  let deduct = null;

  if (status === "processed") {
    if (!confirm("이 버튼은 기록만 정리합니다. 실제 환불(입금)은 되지 않습니다.\n\n" +
                 "포트원 콘솔에서 이미 취소하신 건을 마무리할 때 사용하세요.\n계속하시겠습니까?")) return;
    const c = prompt("회수할 크레딧을 입력하세요. (10 크레딧 = 분석 1건)\n회수하지 않으려면 0을 입력하세요.", "0");
    if (c === null) return;
    deduct = parseInt(c, 10);
    if (isNaN(deduct) || deduct < 0) { toast("숫자를 입력해주세요."); return; }
    note = prompt("처리 메모 (내부 기록용)", "포트원에서 직접 취소") ?? "";
  } else {
    const n = prompt("반려 사유 (내부 기록용)", "");
    if (n === null) return;
    note = n;
  }

  try {
    const d = await api("POST", `/admin/refund-requests/${id}/resolve`,
                        { status, admin_note: note, deduct_credits: deduct });
    let msg = `${label}되었습니다.`;
    if (d.credits_deducted) msg += ` 크레딧 ${d.credits_deducted} 회수`;
    if (d.credits_shortfall) msg += ` / ⚠️ ${d.credits_shortfall} 크레딧은 이미 사용해 회수하지 못했습니다`;
    toast(msg);
    renderRefundList(await api("GET", "/admin/refund-requests"));
  } catch (e) { toast("오류: " + e.message); }
}

// 프로모션(할인) 코드 관리
// ══════════════════════════════════════════════════════════
let promos = [];
const PKG_LABEL = { single: "1건", standard: "5건", mega: "10건" };
const SITE_BASE = location.origin + location.pathname.replace(/admin\.html$/, "");

async function togglePromoList() {
  const card = document.getElementById("promoCard");
  const btn = document.getElementById("promoToggleBtn");
  if (!card.classList.contains("hidden")) {
    card.classList.add("hidden");
    btn.textContent = "🎟️ 프로모션 코드 관리";
    return;
  }
  hideOtherCards("promoCard");
  btn.textContent = "불러오는 중...";
  try {
    const d = await api("GET", "/admin/promos");
    promos = d.promos || [];
    renderPromoCard();
    card.classList.remove("hidden");
    btn.textContent = "🎟️ 목록 닫기";
  } catch (e) {
    toast("오류: " + e.message);
    btn.textContent = "🎟️ 프로모션 코드 관리";
  }
}

function renderPromoCard() {
  const rows = promos.map(p => {
    const pkgs = p.packages ? p.packages.split(",").map(x => PKG_LABEL[x] || x).join(", ") : "전체";
    const period = (p.valid_from || p.valid_until)
      ? `${p.valid_from || "즉시"} ~ ${p.valid_until || "무기한"}` : "제한 없음";
    const uses = p.max_uses ? `${p.used_count} / ${p.max_uses}` : `${p.used_count}회`;
    return `<tr>
      <td><strong style="font-size:13px;color:var(--text);">${esc(p.code)}</strong>
          ${p.memo ? `<div class="muted">${esc(p.memo)}</div>` : ""}
          <div class="muted">${p.once_per_user ? "1인 1회" : "횟수 제한 없음"}</div></td>
      <td><span class="tag tag-pct">${p.discount_percent}%</span></td>
      <td>${esc(pkgs)}</td>
      <td class="muted">${esc(period)}</td>
      <td>${esc(uses)}</td>
      <td><span class="tag ${p.enabled ? "tag-on" : "tag-off"}">${p.enabled ? "사용중" : "중단"}</span></td>
      <td><div class="row-actions">
        <button class="btn-ghost btn-xs" onclick="copyPromoLink('${esc(p.code)}', this)">링크</button>
        <button class="btn-ghost btn-xs" onclick="editPromo(${p.id})">수정</button>
        <button class="btn-ghost btn-xs" onclick="togglePromo(${p.id})">${p.enabled ? "중단" : "재개"}</button>
        <button class="btn-ghost btn-xs" onclick="showPromoUses(${p.id}, '${esc(p.code)}')">사용현황</button>
        <button class="btn-ghost btn-xs" style="color:var(--danger);" onclick="deletePromo(${p.id}, '${esc(p.code)}')">삭제</button>
      </div></td>
    </tr>`;
  }).join("");

  document.getElementById("promoCard").innerHTML = `
    <div class="section-title" style="margin-top:0;" id="promoFormTitle">새 코드 만들기</div>
    <input type="hidden" id="p-id"/>
    <div class="form-grid">
      <div class="field"><label>코드 (필수)</label><input type="text" id="p-code" placeholder="예: WELCOME50" style="text-transform:uppercase"/></div>
      <div class="field"><label>할인율 % (필수)</label><input type="number" id="p-percent" min="1" max="100" placeholder="50"/></div>
      <div class="field"><label>적용 이용권</label>
        <select id="p-packages">
          <option value="">전체 이용권</option>
          <option value="single">1건만</option>
          <option value="standard">5건만</option>
          <option value="mega">10건만</option>
        </select></div>
      <div class="field"><label>시작일 (비우면 즉시)</label><input type="date" id="p-from"/></div>
      <div class="field"><label>종료일 (비우면 무기한)</label><input type="date" id="p-until"/></div>
      <div class="field"><label>총 사용횟수 (비우면 무제한)</label><input type="number" id="p-max" min="1" placeholder="예: 100"/></div>
      <div class="field"><label>메모 (관리용)</label><input type="text" id="p-memo" placeholder="예: 블로그 이벤트"/></div>
    </div>
    <div class="check-row">
      <label><input type="checkbox" id="p-once" checked/> 한 계정당 1회만 사용</label>
      <label><input type="checkbox" id="p-enabled" checked/> 바로 사용 가능하게</label>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn-primary" onclick="savePromo()">저장</button>
      <button class="btn-ghost hidden" id="promoCancelBtn" onclick="resetPromoForm()">수정 취소</button>
    </div>
    <div class="error-msg" id="promo-error"></div>
    <div class="muted" style="margin-top:8px;">할인율을 바꾸면 그 이후 결제부터 적용됩니다. 이미 끝난 결제에는 소급되지 않습니다.</div>

    <div class="section-title">코드 목록 (${promos.length}개)</div>
    <div class="table-wrap"><table>
      <thead><tr><th>코드</th><th>할인</th><th>적용</th><th>기간</th><th>사용</th><th>상태</th><th>관리</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:#9aa7b8;">만든 코드가 없습니다.</td></tr>'}</tbody>
    </table></div>
    <div id="promoUses"></div>`;
}

function promoErr(msg) {
  const el = document.getElementById("promo-error");
  el.textContent = msg || "";
  el.style.display = msg ? "block" : "none";
}

function resetPromoForm() {
  ["p-id","p-code","p-percent","p-from","p-until","p-max","p-memo"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("p-packages").value = "";
  document.getElementById("p-once").checked = true;
  document.getElementById("p-enabled").checked = true;
  document.getElementById("promoFormTitle").textContent = "새 코드 만들기";
  document.getElementById("promoCancelBtn").classList.add("hidden");
  promoErr("");
}

function editPromo(id) {
  const p = promos.find(x => x.id === id);
  if (!p) return;
  document.getElementById("p-id").value = p.id;
  document.getElementById("p-code").value = p.code;
  document.getElementById("p-percent").value = p.discount_percent;
  document.getElementById("p-packages").value = p.packages || "";
  document.getElementById("p-from").value = p.valid_from || "";
  document.getElementById("p-until").value = p.valid_until || "";
  document.getElementById("p-max").value = p.max_uses == null ? "" : p.max_uses;
  document.getElementById("p-memo").value = p.memo || "";
  document.getElementById("p-once").checked = !!p.once_per_user;
  document.getElementById("p-enabled").checked = !!p.enabled;
  document.getElementById("promoFormTitle").textContent = p.code + " 코드 수정";
  document.getElementById("promoCancelBtn").classList.remove("hidden");
  promoErr("");
  document.getElementById("promoCard").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function savePromo() {
  const id = document.getElementById("p-id").value;
  const body = {
    code: document.getElementById("p-code").value.trim().toUpperCase(),
    discount_percent: parseInt(document.getElementById("p-percent").value || "0", 10),
    packages: document.getElementById("p-packages").value,
    valid_from: document.getElementById("p-from").value,
    valid_until: document.getElementById("p-until").value,
    max_uses: document.getElementById("p-max").value ? parseInt(document.getElementById("p-max").value, 10) : null,
    once_per_user: document.getElementById("p-once").checked,
    enabled: document.getElementById("p-enabled").checked,
    memo: document.getElementById("p-memo").value.trim(),
  };
  if (id) body.id = parseInt(id, 10);
  promoErr("");
  try {
    const d = await api("POST", "/admin/promos", body);
    toast(`${d.promo.code} 코드를 저장했습니다.`);
    const list = await api("GET", "/admin/promos");
    promos = list.promos || [];
    renderPromoCard();
  } catch (e) { promoErr(e.message); }
}

async function togglePromo(id) {
  try {
    await api("POST", `/admin/promos/${id}/toggle`);
    const list = await api("GET", "/admin/promos");
    promos = list.promos || [];
    renderPromoCard();
  } catch (e) { toast("오류: " + e.message); }
}

async function deletePromo(id, code) {
  if (!confirm(`${code} 코드를 삭제할까요?\n사용 내역도 함께 지워지며 되돌릴 수 없습니다.\n(잠시 중단만 하시려면 '중단'을 쓰세요)`)) return;
  try {
    await api("DELETE", `/admin/promos/${id}`);
    toast("삭제되었습니다.");
    const list = await api("GET", "/admin/promos");
    promos = list.promos || [];
    renderPromoCard();
  } catch (e) { toast("오류: " + e.message); }
}

function copyPromoLink(code, btn) {
  const link = SITE_BASE + "?promo=" + encodeURIComponent(code);
  const done = () => { const t = btn.textContent; btn.textContent = "복사됨"; setTimeout(() => btn.textContent = t, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(done).catch(() => prompt("아래 링크를 복사하세요", link));
  } else prompt("아래 링크를 복사하세요", link);
}

async function showPromoUses(id, code) {
  const box = document.getElementById("promoUses");
  box.innerHTML = `<div class="section-title">${esc(code)} 사용 현황</div><p class="muted">불러오는 중...</p>`;
  try {
    const d = await api("GET", `/admin/promos/${id}/uses`);
    const uses = d.uses || [];
    box.innerHTML = `<div class="section-title">${esc(code)} 사용 현황 (${uses.length}건)</div>` + (uses.length
      ? `<div class="table-wrap"><table>
          <thead><tr><th>사용일시</th><th>계정</th><th>이용권</th><th>정가</th><th>결제금액</th></tr></thead>
          <tbody>${uses.map(u => `<tr>
            <td>${esc(fmtDT(u.created_at, true))}</td><td>${esc(u.email)}</td><td>${esc(u.package_label)}</td>
            <td class="muted">${Number(u.original_price).toLocaleString("ko-KR")}원</td>
            <td><strong>${Number(u.paid_price).toLocaleString("ko-KR")}원</strong></td>
          </tr>`).join("")}</tbody></table></div>`
      : `<p class="muted">아직 사용된 적이 없습니다.</p>`);
  } catch (e) { box.innerHTML = `<p style="color:var(--danger);font-size:12px;">${esc(e.message)}</p>`; }
}

    </div>
    <div class="search-row">
      <input type="text" id="hist-search" value="${esc(q)}" placeholder="이메일 · 회사명 · 대표자명 · 사업자번호로 검색"
             onkeydown="if(event.key==='Enter')searchHistories()"/>
      <button class="btn-primary" onclick="searchHistories()">검색</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>분석일시</th><th>회원</th><th>분석 대상</th><th>구분</th><th>매출</th><th>안정성</th><th>출력</th><th></th></tr></thead>
      <tbody>${body || '<tr><td colspan="8" style="text-align:center;color:#9aa7b8;">조회된 분석이력이 없습니다.</td></tr>'}</tbody>
    </table></div>`;
}

// 고객 화면과 같은 코드로 리포트를 그리기 위해 index.html을 새 탭으로 연다
// (관리자 열람은 출력완료로 기록되지 않는다)
function openMemberReport(id) {
  try { sessionStorage.setItem("fa_admin_pw", adminPw); } catch (e) {}
  window.open("index.html?adminHistory=" + encodeURIComponent(id), "_blank");
}

// ── 커뮤니티 게시글 관리 ──
async function toggleCommunityList() {
  const card = document.getElementById("communityListCard");
  const btn = document.getElementById("communityToggleBtn");
  if (!card.classList.contains("hidden")) {
    card.classList.add("hidden");
    btn.textContent = "🗨️ 커뮤니티 게시글 관리";
    return;
  }
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("userListCard").classList.add("hidden");
  document.getElementById("refundListCard").classList.add("hidden");
  btn.textContent = "불러오는 중...";
  try {
    const d = await api("GET", "/admin/community/posts");
    renderCommunityList(d);
    card.classList.remove("hidden");
    btn.textContent = "🗨️ 목록 닫기";
  } catch (e) {
    toast_admin_error(e.message);
    btn.textContent = "🗨️ 커뮤니티 게시글 관리";
  }
}

function communityAdminEscape(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function renderCommunityList(d) {
  const card = document.getElementById("communityListCard");
  const rows = d.posts.map(p => `
    <div style="border-bottom:1px solid var(--border);padding:10px 0;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div>
          <div style="font-size:13px;font-weight:700;">${communityAdminEscape(p.title)}</div>
          <div style="font-size:11px;color:#9aa7b8;margin-top:2px;">${p.author_email} · 댓글 ${p.comment_count} · ${p.created_at ? p.created_at.slice(0,10) : "-"}</div>
          <div style="font-size:12px;color:#6b7a8d;margin-top:4px;white-space:pre-wrap;">${communityAdminEscape(p.content)}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">
          <button class="btn-ghost" style="padding:4px 10px;font-size:11px;" onclick="toggleCommunityComments(${p.id})">댓글보기</button>
          <button style="padding:4px 10px;font-size:11px;background:var(--danger);color:#fff;" onclick="adminDeleteCommunityPost(${p.id})">글삭제</button>
        </div>
      </div>
      <div id="community-comments-${p.id}" class="hidden" style="margin-top:8px;padding-left:10px;border-left:2px solid var(--border);"></div>
    </div>`).join("");
  card.innerHTML = `
    <div class="section-title">커뮤니티 게시글 (${d.count}건)</div>
    ${rows || `<p style="text-align:center;color:#9aa7b8;font-size:13px;padding:12px 0;">등록된 글이 없습니다.</p>`}`;
}

async function toggleCommunityComments(postId) {
  const el = document.getElementById(`community-comments-${postId}`);
  if (!el.classList.contains("hidden")) {
    el.classList.add("hidden");
    return;
  }
  el.classList.remove("hidden");
  el.innerHTML = `<p style="font-size:12px;color:#9aa7b8;">불러오는 중...</p>`;
  try {
    const d = await api("GET", `/admin/community/posts/${postId}/comments`);
    el.innerHTML = d.comments.length
      ? d.comments.map(c => `
        <div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:12px;">
          <div>
            <div style="color:#9aa7b8;">${c.author_email} · ${c.created_at ? c.created_at.slice(0,10) : "-"}</div>
            <div style="margin-top:2px;">${communityAdminEscape(c.content)}</div>
          </div>
          <button style="padding:3px 8px;font-size:10px;background:var(--danger);color:#fff;flex-shrink:0;" onclick="adminDeleteCommunityComment(${c.id}, ${postId})">삭제</button>
        </div>`).join("")
      : `<p style="font-size:12px;color:#9aa7b8;">댓글이 없습니다.</p>`;
  } catch (e) {
    el.innerHTML = `<p style="font-size:12px;color:var(--danger);">${e.message}</p>`;
  }
}

async function adminDeleteCommunityPost(postId) {
  if (!confirm("이 게시글을 삭제하시겠습니까? 댓글도 함께 삭제됩니다.")) return;
  try {
    await api("DELETE", `/admin/community/posts/${postId}`);
    toast("게시글이 삭제되었습니다.");
    const d = await api("GET", "/admin/community/posts");
    renderCommunityList(d);
  } catch (e) { toast("오류: " + e.message); }
}

async function adminDeleteCommunityComment(commentId, postId) {
  if (!confirm("이 댓글을 삭제하시겠습니까?")) return;
  try {
    await api("DELETE", `/admin/community/comments/${commentId}`);
    toast("댓글이 삭제되었습니다.");
    toggleCommunityComments(postId);
    toggleCommunityComments(postId);
  } catch (e) { toast("오류: " + e.message); }
}

function renderResult(d) {
  const card = document.getElementById("resultCard");
  card.classList.remove("hidden");

  const paymentsRows = d.payments.length
    ? d.payments.map(p => `<tr><td>${p.created_at ? p.created_at.slice(0,10) : "-"}</td><td>${p.package_id || "-"}</td><td>${p.amount ? p.amount.toLocaleString() + "원" : "-"}</td><td>+${Math.floor((p.credits||0)/10)}건</td></tr>`).join("")
    : `<tr><td colspan="4" style="text-align:center;color:#9aa7b8;">결제 내역 없음</td></tr>`;

  const analysesRows = d.recent_analyses.length
    ? d.recent_analyses.map(l => `<tr><td>${l.created_at ? l.created_at.slice(0,16).replace('T',' ') : "-"}</td><td>-${Math.floor((l.credits_used||0)/10)}건</td></tr>`).join("")
    : `<tr><td colspan="2" style="text-align:center;color:#9aa7b8;">분석 내역 없음</td></tr>`;

  card.innerHTML = `
    <div class="count-badge">잔여횟수 ${d.remaining_count}건 <span>(${d.credits} 크레딧)</span></div>

    <div class="info-grid">
      <div class="info-item"><div class="l">회사명</div><div class="v">${d.company_name || "-"}</div></div>
      <div class="info-item"><div class="l">대표자명</div><div class="v">${d.rep_name || "-"}</div></div>
      <div class="info-item"><div class="l">사업자번호</div><div class="v">${d.business_number || "-"}</div></div>
      <div class="info-item"><div class="l">휴대폰번호</div><div class="v">${d.phone || "-"}</div></div>
      <div class="info-item" style="grid-column:1/-1;"><div class="l">이메일 / 가입일</div><div class="v">${d.email} · ${d.created_at ? d.created_at.slice(0,10) : "-"}</div></div>
    </div>

    <div class="section-title">⚡ 빠른 조정</div>
    <div class="quick-row">
      <button class="btn-ghost" onclick="adjust(-10)">-10건</button>
      <button class="btn-ghost" onclick="adjust(-1)">-1건</button>
      <button class="btn-ghost" onclick="adjust(1)">+1건</button>
      <button class="btn-ghost" onclick="adjust(5)">+5건</button>
      <button class="btn-ghost" onclick="adjust(10)">+10건</button>
    </div>

    <div class="section-title">직접 입력</div>
    <div class="row" style="margin-bottom:8px;">
      <input type="number" id="delta-input" placeholder="증감할 건수 (예: -3 또는 7)" />
      <button class="btn-primary" onclick="adjustCustom()">증감 적용</button>
    </div>
    <div class="row">
      <input type="number" id="set-input" placeholder="정확한 잔여횟수로 설정 (예: 20)" />
      <button class="btn-primary" onclick="setExact()">값으로 설정</button>
    </div>

    <div class="section-title">✏️ 회원정보 수정</div>
    <div class="field">
      <label>이메일</label>
      <input type="email" id="edit-email" value="${d.email}" />
    </div>
    <div class="field">
      <label>휴대폰번호</label>
      <input type="tel" id="edit-phone" value="${d.phone || ""}" />
    </div>
    <div class="field">
      <label>새 비밀번호 (변경할 때만 입력, 4자 이상)</label>
      <input type="text" id="edit-password" placeholder="비워두면 비밀번호는 그대로 유지" />
    </div>
    <div class="error-msg" id="edit-error"></div>
    <button class="btn-primary btn-full" onclick="saveUserEdit()">회원정보 저장</button>

    <div class="section-title">💳 최근 결제 내역</div>
    <table><thead><tr><th>날짜</th><th>패키지</th><th>금액</th><th>지급건수</th></tr></thead><tbody>${paymentsRows}</tbody></table>

    <div class="section-title">📄 최근 분석 내역</div>
    <table><thead><tr><th>일시</th><th>사용건수</th></tr></thead><tbody>${analysesRows}</tbody></table>

    <div class="section-title" style="color:#A32D2D;">⚠️ 회원 탈퇴</div>
    <p style="font-size:12px;color:#7a8ca3;margin-bottom:10px;">이 회원의 계정, 결제내역, 분석내역이 모두 삭제됩니다. 이 작업은 되돌릴 수 없습니다.</p>
    <button class="btn-full" style="background:#A32D2D;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;" onclick="deleteUser()">회원 탈퇴시키기</button>
  `;
}

async function saveUserEdit() {
  const newEmail = document.getElementById("edit-email").value.trim();
  const newPhone = document.getElementById("edit-phone").value.trim();
  const newPassword = document.getElementById("edit-password").value;
  const errEl = document.getElementById("edit-error");
  errEl.style.display = "none";

  const body = { email: currentEmail };
  if (newEmail && newEmail !== currentEmail) body.new_email = newEmail;
  if (newPhone) body.new_phone = newPhone;
  if (newPassword) body.new_password = newPassword;

  try {
    const d = await api("POST", "/admin/update-user", body);
    toast("회원 정보가 저장되었습니다.");
    currentEmail = d.email;
    document.getElementById("search-email").value = d.email;
    searchUser();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = "block";
  }
}

async function deleteUser() {
  if (!confirm(`정말로 ${currentEmail} 회원을 탈퇴시키겠습니까?\n계정, 결제내역, 분석내역이 모두 삭제되며 되돌릴 수 없습니다.`)) return;
  const doubleCheck = prompt(`확인을 위해 회원 이메일(${currentEmail})을 정확히 입력해주세요.`);
  if (doubleCheck !== currentEmail) {
    toast("이메일이 일치하지 않아 취소되었습니다.");
    return;
  }
  try {
    const d = await api("POST", "/admin/delete-user", { email: currentEmail });
    toast(d.message);
    document.getElementById("resultCard").classList.add("hidden");
    document.getElementById("search-email").value = "";
  } catch (e) {
    toast("오류: " + e.message);
  }
}

async function adjust(delta) {
  try {
    const d = await api("POST", "/admin/adjust-credits", { email: currentEmail, delta_count: delta });
    toast(`${delta > 0 ? "+" : ""}${delta}건 적용 완료 → 잔여횟수 ${d.remaining_count}건`);
    searchUser();
  } catch (e) { toast("오류: " + e.message); }
}

async function adjustCustom() {
  const val = parseInt(document.getElementById("delta-input").value);
  if (isNaN(val)) return toast("증감할 건수를 입력해주세요.");
  await adjust(val);
  document.getElementById("delta-input").value = "";
}

async function setExact() {
  const val = parseInt(document.getElementById("set-input").value);
  if (isNaN(val) || val < 0) return toast("올바른 잔여횟수를 입력해주세요.");
  try {
    const d = await api("POST", "/admin/set-credits", { email: currentEmail, remaining_count: val });
    toast(`잔여횟수를 ${d.remaining_count}건으로 설정했습니다.`);
    document.getElementById("set-input").value = "";
    searchUser();
  } catch (e) { toast("오류: " + e.message); }
}
</script>
</body>
</html>
